[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "disk-insight"
version = "1.0.0"
description = "Safe local disk usage analyzer with actionable reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
dependencies = []

[project.scripts]
disk-insight = "disk_insight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disk_insight"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
